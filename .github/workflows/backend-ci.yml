name: Full Stack CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: full-stack-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Test and Check Flyway
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: TodoListProject
    env:
      SPRING_PROFILES_ACTIVE: test
      FILE_STORAGE_ROOT_PATH: build/ci-uploads
      DOCKER_API_VERSION: "1.44"

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            TodoListProject/*.gradle*
            TodoListProject/gradle/wrapper/gradle-wrapper.properties

      - name: Grant execute permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Build and run all tests
        run: ./gradlew clean test --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: TodoListProject/build/reports/tests/test
          if-no-files-found: ignore
          retention-days: 7

  frontend-build:
    name: Build Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Fe

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Fe/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build frontend
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: Fe/dist
          if-no-files-found: error
          retention-days: 7

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build-and-test, frontend-build]

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./TodoListProject
          file: ./TodoListProject/Dockerfile
          push: false
          tags: task-management-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./Fe
          file: ./Fe/Dockerfile
          push: false
          tags: task-management-frontend:${{ github.sha }}
          build-args: |
            VITE_API_URL=/api
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
