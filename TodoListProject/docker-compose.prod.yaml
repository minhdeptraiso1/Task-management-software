services:
  postgres:
    image: postgres:16-alpine
    container_name: task_management_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-task_management}
      POSTGRES_USER: ${DB_USERNAME:-task_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be configured}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - task_management_network

  redis:
    image: redis:7-alpine
    container_name: task_management_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - task_management_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task_management_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONTEXT_PATH: /api
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-task_management}
      DB_USERNAME: ${DB_USERNAME:-task_user}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be configured}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be configured}
      JWT_ACCESS_EXP_MINUTES: ${JWT_ACCESS_EXP_MINUTES:-30}
      JWT_REFRESH_EXP_DAYS: ${JWT_REFRESH_EXP_DAYS:-7}
      FILE_STORAGE_ROOT_PATH: /app/uploads
      CORS_ALLOWED_ORIGINS: ${APP_ORIGIN:-https://hoangitk.io.vn}
      CORS_ALLOW_CREDENTIALS: "false"
    volumes:
      - upload_data:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/api/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks:
      - task_management_network

  frontend:
    build:
      context: ../Fe
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: task_management_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - task_management_network

  caddy:
    image: caddy:2.10-alpine
    container_name: task_management_caddy
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:-hoangitk.io.vn}
      WWW_DOMAIN: ${WWW_DOMAIN:-www.hoangitk.io.vn}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL must be configured}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - task_management_network

volumes:
  postgres_data:
  redis_data:
  upload_data:
  caddy_data:
  caddy_config:

networks:
  task_management_network:
    driver: bridge
