x-backend-runtime-environment: &backend-runtime-environment
  SERVER_PORT: ${SERVER_PORT:-8080}
  APP_VERSION: ${APP_VERSION:-1.0.0}
  REDIS_TIMEOUT: ${REDIS_TIMEOUT:-3000ms}
  HIBERNATE_JDBC_BATCH_SIZE: ${HIBERNATE_JDBC_BATCH_SIZE:-50}
  MULTIPART_MAX_FILE_SIZE: ${MULTIPART_MAX_FILE_SIZE:-10MB}
  MULTIPART_MAX_REQUEST_SIZE: ${MULTIPART_MAX_REQUEST_SIZE:-10MB}
  FILE_STORAGE_MAX_SIZE_BYTES: ${FILE_STORAGE_MAX_SIZE_BYTES:-10485760}
  FILE_STORAGE_MAX_FILES_PER_ENTITY: ${FILE_STORAGE_MAX_FILES_PER_ENTITY:-20}
  FILE_STORAGE_MAX_PROJECT_STORAGE_BYTES: ${FILE_STORAGE_MAX_PROJECT_STORAGE_BYTES:-524288000}
  FILE_STORAGE_KEEP_DELETED_FILE_DAYS: ${FILE_STORAGE_KEEP_DELETED_FILE_DAYS:-30}
  REPORT_PDF_FONT_PATH: ${REPORT_PDF_FONT_PATH:-fonts/NotoSans-Regular.ttf}
  REPORT_PDF_BOLD_FONT_PATH: ${REPORT_PDF_BOLD_FONT_PATH:-fonts/NotoSans-Bold.ttf}
  CACHE_DEFAULT_TTL: ${CACHE_DEFAULT_TTL:-PT10M}
  CACHE_TTL_USER_DETAIL: ${CACHE_TTL_USER_DETAIL:-PT10M}
  CACHE_TTL_USER_CURRENT: ${CACHE_TTL_USER_CURRENT:-PT5M}
  CACHE_TTL_USER_SEARCH: ${CACHE_TTL_USER_SEARCH:-PT2M}
  CACHE_TTL_PROJECT_DETAIL: ${CACHE_TTL_PROJECT_DETAIL:-PT30M}
  CACHE_TTL_PROJECT_SEARCH_RESULT: ${CACHE_TTL_PROJECT_SEARCH_RESULT:-PT2M}
  CACHE_TTL_PROJECT_MEMBERS: ${CACHE_TTL_PROJECT_MEMBERS:-PT30M}
  CACHE_TTL_CURRENT_SPRINT: ${CACHE_TTL_CURRENT_SPRINT:-PT10M}
  CACHE_TTL_SPRINT_DETAIL: ${CACHE_TTL_SPRINT_DETAIL:-PT10M}
  CACHE_TTL_SPRINT_KANBAN: ${CACHE_TTL_SPRINT_KANBAN:-PT3M}
  CACHE_TTL_TASK_DETAIL: ${CACHE_TTL_TASK_DETAIL:-PT10M}
  CACHE_TTL_TASK_TIME_SUMMARY: ${CACHE_TTL_TASK_TIME_SUMMARY:-PT5M}
  CACHE_TTL_SPRINT_TASK_STATISTICS: ${CACHE_TTL_SPRINT_TASK_STATISTICS:-PT5M}
  CACHE_TTL_SPRINT_BURNDOWN: ${CACHE_TTL_SPRINT_BURNDOWN:-PT5M}
  CACHE_TTL_MY_DASHBOARD: ${CACHE_TTL_MY_DASHBOARD:-PT5M}
  CACHE_TTL_PROJECT_DASHBOARD: ${CACHE_TTL_PROJECT_DASHBOARD:-PT5M}
  CACHE_TTL_NOTIFICATION_UNREAD_COUNT: ${CACHE_TTL_NOTIFICATION_UNREAD_COUNT:-PT1M}
  CACHE_TTL_NOTIFICATION_LIST: ${CACHE_TTL_NOTIFICATION_LIST:-PT2M}
  CACHE_TTL_ATTACHMENT_LIST: ${CACHE_TTL_ATTACHMENT_LIST:-PT5M}
  CACHE_TTL_ATTACHMENT_USAGE: ${CACHE_TTL_ATTACHMENT_USAGE:-PT5M}
  CACHE_TTL_ATTACHMENT_SECURITY_SUMMARY: ${CACHE_TTL_ATTACHMENT_SECURITY_SUMMARY:-PT30M}
  CACHE_TTL_FILE_CLEANUP_RESULT: ${CACHE_TTL_FILE_CLEANUP_RESULT:-PT1M}
  CACHE_TTL_ANALYTICS_VELOCITY: ${CACHE_TTL_ANALYTICS_VELOCITY:-PT2M}
  CACHE_TTL_ANALYTICS_PROJECT_BURNUP: ${CACHE_TTL_ANALYTICS_PROJECT_BURNUP:-PT2M}
  CACHE_TTL_ANALYTICS_SPRINT_BURNUP: ${CACHE_TTL_ANALYTICS_SPRINT_BURNUP:-PT2M}
  CACHE_TTL_ANALYTICS_CUMULATIVE_FLOW: ${CACHE_TTL_ANALYTICS_CUMULATIVE_FLOW:-PT2M}
  CACHE_TTL_ANALYTICS_SUMMARY: ${CACHE_TTL_ANALYTICS_SUMMARY:-PT2M}
  CACHE_TTL_ADMIN_DASHBOARD: ${CACHE_TTL_ADMIN_DASHBOARD:-PT2M}
  CACHE_TTL_ADMIN_AUDIT_SEARCH: ${CACHE_TTL_ADMIN_AUDIT_SEARCH:-PT1M}
  CACHE_TTL_ADMIN_AUDIT_DETAIL: ${CACHE_TTL_ADMIN_AUDIT_DETAIL:-PT5M}
  CACHE_TTL_ADMIN_AUDIT_SUMMARY: ${CACHE_TTL_ADMIN_AUDIT_SUMMARY:-PT1M}
  CACHE_TTL_ADMIN_IMPORT_AUDIT_SEARCH: ${CACHE_TTL_ADMIN_IMPORT_AUDIT_SEARCH:-PT1M}
  CACHE_TTL_ADMIN_FILE_AUDIT_SEARCH: ${CACHE_TTL_ADMIN_FILE_AUDIT_SEARCH:-PT1M}
  CACHE_TTL_ADMIN_USER_ACTIVITY_AUDIT: ${CACHE_TTL_ADMIN_USER_ACTIVITY_AUDIT:-PT1M}

services:
  postgres:
    image: postgres:16-alpine
    container_name: task_management_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-task_management}
      POSTGRES_USER: ${DB_USERNAME:-task_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be configured}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - task_management_network

  redis:
    image: redis:7-alpine
    container_name: task_management_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - task_management_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task_management_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *backend-runtime-environment
      SPRING_PROFILES_ACTIVE: prod
      CONTEXT_PATH: /api
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-task_management}
      DB_USERNAME: ${DB_USERNAME:-task_user}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be configured}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be configured}
      JWT_ACCESS_EXP_MINUTES: ${JWT_ACCESS_EXP_MINUTES:-30}
      JWT_REFRESH_EXP_DAYS: ${JWT_REFRESH_EXP_DAYS:-7}
      FILE_STORAGE_ROOT_PATH: /app/uploads
      CORS_ALLOWED_ORIGINS: ${APP_ORIGIN:-https://hoangitk.io.vn}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-false}
    volumes:
      - upload_data:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/api/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks:
      - task_management_network

  frontend:
    build:
      context: ../Fe
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: task_management_frontend
    restart: unless-stopped
    environment:
      PORT: 8080
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-_}
      NGINX_BACKEND_URL: ${NGINX_BACKEND_URL:-http://backend:8080}
      NGINX_BACKEND_HOST: ${NGINX_BACKEND_HOST:-backend}
      NGINX_CLIENT_MAX_BODY_SIZE: ${NGINX_CLIENT_MAX_BODY_SIZE:-10m}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1:$${PORT}/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - task_management_network

  caddy:
    image: caddy:2.10-alpine
    container_name: task_management_caddy
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:-hoangitk.io.vn}
      WWW_DOMAIN: ${WWW_DOMAIN:-www.hoangitk.io.vn}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL must be configured}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - task_management_network

volumes:
  postgres_data:
  redis_data:
  upload_data:
  caddy_data:
  caddy_config:

networks:
  task_management_network:
    driver: bridge
