services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: task_management_cloudflared
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN must be configured in .env}
    networks:
      - task_management_network
