server:
  servlet:
    context-path: ${CONTEXT_PATH}
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:10MB}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: ${HIBERNATE_JDBC_BATCH_SIZE:50}
          batch_versioned_data: true
        order_inserts: true
        order_updates: true

  flyway:
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:3000ms}

  cache:
    type: redis

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
    path: /swagger

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-minutes: ${JWT_ACCESS_EXP_MINUTES:30}
    refresh-token-expiration-days: ${JWT_REFRESH_EXP_DAYS:7}
  file-storage:
    root-path: ${FILE_STORAGE_ROOT_PATH:uploads}
    max-file-size-bytes: ${FILE_STORAGE_MAX_SIZE_BYTES:10485760} # 10MB in bytes
    max-files-per-entity: ${FILE_STORAGE_MAX_FILES_PER_ENTITY:20}
    max-project-storage-bytes: ${FILE_STORAGE_MAX_PROJECT_STORAGE_BYTES:524288000} # 500MB in bytes
    keep-deleted-file-days: ${FILE_STORAGE_KEEP_DELETED_FILE_DAYS:30}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:false}
  report:
    pdf:
      font-path: ${REPORT_PDF_FONT_PATH:fonts/NotoSans-Regular.ttf}
      bold-font-path: ${REPORT_PDF_BOLD_FONT_PATH:fonts/NotoSans-Bold.ttf}
  cache:
    default-ttl: ${CACHE_DEFAULT_TTL:PT10M}
    ttl:
      user_detail: ${CACHE_TTL_USER_DETAIL:PT10M}
      user_current: ${CACHE_TTL_USER_CURRENT:PT5M}
      user_search: ${CACHE_TTL_USER_SEARCH:PT2M}
      project_detail: ${CACHE_TTL_PROJECT_DETAIL:PT30M}
      project_search_result: ${CACHE_TTL_PROJECT_SEARCH_RESULT:PT2M}
      project_members: ${CACHE_TTL_PROJECT_MEMBERS:PT30M}
      current_sprint: ${CACHE_TTL_CURRENT_SPRINT:PT10M}
      sprint_detail: ${CACHE_TTL_SPRINT_DETAIL:PT10M}
      sprint_kanban: ${CACHE_TTL_SPRINT_KANBAN:PT3M}
      task_detail: ${CACHE_TTL_TASK_DETAIL:PT10M}
      task_time_summary: ${CACHE_TTL_TASK_TIME_SUMMARY:PT5M}
      sprint_task_statistics: ${CACHE_TTL_SPRINT_TASK_STATISTICS:PT5M}
      sprint_burndown: ${CACHE_TTL_SPRINT_BURNDOWN:PT5M}
      my_dashboard: ${CACHE_TTL_MY_DASHBOARD:PT5M}
      project_dashboard: ${CACHE_TTL_PROJECT_DASHBOARD:PT5M}
      notification_unread_count: ${CACHE_TTL_NOTIFICATION_UNREAD_COUNT:PT1M}
      notification_list: ${CACHE_TTL_NOTIFICATION_LIST:PT2M}
      attachment_list: ${CACHE_TTL_ATTACHMENT_LIST:PT5M}
      attachment_usage: ${CACHE_TTL_ATTACHMENT_USAGE:PT5M}
      attachment_security_summary: ${CACHE_TTL_ATTACHMENT_SECURITY_SUMMARY:PT30M}
      file_cleanup_result: ${CACHE_TTL_FILE_CLEANUP_RESULT:PT1M}
      analytics_velocity: ${CACHE_TTL_ANALYTICS_VELOCITY:PT2M}
      analytics_project_burnup: ${CACHE_TTL_ANALYTICS_PROJECT_BURNUP:PT2M}
      analytics_sprint_burnup: ${CACHE_TTL_ANALYTICS_SPRINT_BURNUP:PT2M}
      analytics_cumulative_flow: ${CACHE_TTL_ANALYTICS_CUMULATIVE_FLOW:PT2M}
      analytics_summary: ${CACHE_TTL_ANALYTICS_SUMMARY:PT2M}
      admin_dashboard: ${CACHE_TTL_ADMIN_DASHBOARD:PT2M}
      admin_audit_search: ${CACHE_TTL_ADMIN_AUDIT_SEARCH:PT1M}
      admin_audit_detail: ${CACHE_TTL_ADMIN_AUDIT_DETAIL:PT5M}
      admin_audit_summary: ${CACHE_TTL_ADMIN_AUDIT_SUMMARY:PT1M}
      admin_import_audit_search: ${CACHE_TTL_ADMIN_IMPORT_AUDIT_SEARCH:PT1M}
      admin_file_audit_search: ${CACHE_TTL_ADMIN_FILE_AUDIT_SEARCH:PT1M}
      admin_user_activity_audit: ${CACHE_TTL_ADMIN_USER_ACTIVITY_AUDIT:PT1M}
