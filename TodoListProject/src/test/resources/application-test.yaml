spring:
  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

  cache:
    type: redis

app:
  jwt:
    secret: test-secret-test-secret-test-secret-test-secret-test-secret
    access-token-expiration-minutes: 60
    refresh-token-expiration-days: 1
  file-storage:
    root-path: build/test-uploads

logging:
  level:
    org.springframework.security: warn
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bind: warn

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
